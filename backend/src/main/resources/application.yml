spring:
  application:
    name: sol-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sol}
    username: ${SPRING_DATASOURCE_USERNAME:sol}
    password: ${SPRING_DATASOURCE_PASSWORD:sol}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

sol:
  jwt:
    secret: ${SOL_JWT_SECRET:dev-secret-change-me-dev-secret-change-me-dev-secret-change-me}
    expiration-minutes: ${SOL_JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${SOL_CORS_ALLOWED_ORIGINS:http://localhost:5173}
